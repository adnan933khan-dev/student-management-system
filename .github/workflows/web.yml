name: Build and Deploy

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Compile to Web
        run: |
          mkdir -p build
          git clone --depth 1 https://github.com/raysan5/raylib.git build/raylib
          cd build/raylib/src
          emmake make PLATFORM=PLATFORM_WEB -B
          cd ../../..
          emcc main.c build/raylib/src/libraylib.web.a -o index.html \
            -Os -Wall -Ibuild/raylib/src \
            -s USE_GLFW=3 -s WASM=1 \
            --shell-file build/raylib/src/minshell.html \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ASYNCIFY=1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
